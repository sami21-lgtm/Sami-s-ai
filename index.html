<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Sami AI - Ultimate Intelligence</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body>

    <div class="background-overlay"></div>

    <div class="sidebar-backdrop" id="sidebarBackdrop" onclick="toggleSidebar()"></div>
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <div class="logo">
                <i class="fa-solid fa-sparkles"></i>
                <span>Sami AI</span>
            </div>
            <button class="icon-btn" onclick="toggleSidebar()"><i class="fa-solid fa-xmark"></i></button>
        </div>

        <button class="new-chat-btn" onclick="createNewChat()">
            <i class="fa-solid fa-plus"></i> New Chat
        </button>

        <div class="history-label">Recent Chats</div>
        <div class="history-list" id="historyList"></div>

        <div class="sidebar-footer">
            <button class="clear-history-btn" onclick="clearAllHistory()">
                <i class="fa-regular fa-trash-can"></i> Clear all chats
            </button>
        </div>
    </aside>

    <main class="main-container">
        <header class="chat-header">
            <button class="icon-btn" onclick="toggleSidebar()"><i class="fa-solid fa-bars-staggered"></i></button>
            <div class="model-badge">
                <i class="fa-solid fa-bolt"></i> Llama 3.3 Turbo & Vision
            </div>
            <button class="icon-btn" onclick="createNewChat()" title="New Chat"><i class="fa-solid fa-pen-to-square"></i></button>
        </header>

        <div class="chat-box" id="chatBox"></div>

        <div class="input-wrapper">
            <div class="file-preview-container" id="filePreviewContainer" style="display: none;"></div>

            <div class="input-box">
                <input type="file" id="fileInput" onchange="handleFileSelect(event)" accept="image/*,.pdf,.docx,.pptx,.txt,.js,.py,.html,.css,.json,.csv,.md" style="display: none;">
                
                <button class="attach-btn" onclick="document.getElementById('fileInput').click()" title="Attach image or file">
                    <i class="fa-solid fa-paperclip"></i>
                </button>

                <input type="text" id="userInput" placeholder="Ask or upload image/file..." onkeypress="handleEnter(event)" autocomplete="off">
                <button id="sendBtn" onclick="sendMessage()"><i class="fa-solid fa-arrow-up"></i></button>
            </div>
            <div class="footer-text">
                Sami AI 2026 • Dept. of Software Engineering, DIU
            </div>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sami's AI Assistant</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="main-container">
        <div class="chat-header">
            <h2>AI Assistant</h2>
        </div>

        <div class="chat-box" id="chatBox">
            <div class="message ai-msg">
                Hello! I am your  AI Assistant. How can I help you today? You can ask me in English or Bengali.
                <button class="voice-btn" onclick="speak('Hello! Ami apnar AI Assistant. How can I help you today?')">🔊 Listen</button>
            </div>
        </div>

        <div class="input-container">
            <input type="text" id="userInput" placeholder="Message your AI..." onkeypress="handleEnter(event)">
            <button onclick="sendMessage()" id="sendBtn">Send</button>
        </div>

        <div class="footer">
            Developed by Md. Emtiaz Hossain Sami 2026<br>
            Dept of Software Engineering, Daffodil International University
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
